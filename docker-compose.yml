# Local evaluation stack for the FastAPI backend and Vite frontend. Running
# this file alone keeps the default in-memory storage mode; the opt-in SQL
# commands are documented in README.md's "Persistence" section.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Overrides vite.config.ts's proxy target (which defaults to
      # 127.0.0.1:8000 for host-machine development) to this Compose
      # network's backend service name -- containers can't reach each
      # other over 127.0.0.1. No source file changes; the override
      # variable already existed for exactly this kind of case.
      VITE_BACKEND_ORIGIN: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
