# Local development only -- runs the existing FastAPI backend and Vite
# frontend exactly as documented in README.md's "Run" and "Run it
# locally" sections, as two containers instead of two manually-started
# host processes. No database service here, and running this file alone
# (`docker compose up --build`, with no -f flags) is unaffected by
# docker-compose.sql.yml's existence -- the backend still runs in its
# default in-memory storage mode. See README.md's "Docker" section for
# start/stop/rebuild commands and troubleshooting, and its "SQL-mode
# overlay (opt-in)" section for the separate, opt-in PostgreSQL stack.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Overrides vite.config.ts's proxy target (which defaults to
      # 127.0.0.1:8000 for host-machine development) to this Compose
      # network's backend service name -- containers can't reach each
      # other over 127.0.0.1. No source file changes; the override
      # variable already existed for exactly this kind of case.
      VITE_BACKEND_ORIGIN: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
